spring.application.name=AuthAPI

server.port=${PORT:8081}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=none

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# Esta API no tiene relaciones perezosas: la conexión se libera al terminar cada transacción
spring.jpa.open-in-view=false

# Recursos ajustados a un dyno Eco de 512 MB (los valores por defecto son 200 hilos y 10 conexiones)
server.tomcat.threads.max=${TOMCAT_MAX_THREADS:20}
server.tomcat.threads.min-spare=4
server.tomcat.accept-count=100
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:5}
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

security.jwt.secret-key=${JWT_SECRET}
security.jwt.expiration-time=${JWT_EXPIRATION:900000}
security.jwt.expiration-time-movil=${JWT_EXPIRATION_MOVIL:2592000000}

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://psykeweb.vercel.app,http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000,http://127.0.0.1:8080,http://localhost:8080,http://localhost,http://localhost:5173}

# Correo (Gmail). El usuario y la contraseña de aplicación van en las Config Vars de Heroku o en el .env
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

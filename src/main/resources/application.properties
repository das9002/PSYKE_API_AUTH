spring.application.name=AuthAPI

server.port=8081
java.runtime.version=17

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=none

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

security.jwt.secret-key=${JWT_SECRET}
security.jwt.expiration-time=${JWT_EXPIRATION}

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Pool de conexiones reducido: la Autonomous DB gratuita admite pocas sesiones simultaneas (ORA-03113 al exceder)
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.keepalive-time=120000
# Autonomous DB activa DML en paralelo: tras un UPDATE masivo no se puede leer la tabla en la misma transaccion (ORA-12838)
spring.datasource.hikari.connection-init-sql=ALTER SESSION DISABLE PARALLEL DML

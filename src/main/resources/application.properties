spring.application.name=AuthAPI

server.port=8081

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=none

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

security.jwt.secret-key=${JWT_SECRET}
security.jwt.expiration-time=${JWT_EXPIRATION:900000}

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://psykeweb.vercel.app,http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000,http://127.0.0.1:8080,http://localhost:8080,http://localhost,http://localhost:5173}

# Correo (Gmail). El usuario y la contraseña de aplicación van en las Config Vars de Heroku:
# spring.mail.username y spring.mail.password
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
